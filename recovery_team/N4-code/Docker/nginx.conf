server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA: fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy tile requests to TileServer-GL container
    # Uncomment if running tileserver service in docker-compose.yml
    # location /tiles/ {
    #     proxy_pass http://tileserver:8080/;
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
}
