; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<mega_stub.cpp>
lib_deps = 
	mikalhart/TinyGPSPlus@^1.0.3
	tomstewart89/BasicLinearAlgebra @ ^5.1
	Knolleary/PubSubClient@^2.8
	sparkfun/Sparkfun BMP180@^1.1.2
	paulstoffregen/SerialFlash@0.0.0-alpha+sha.2b86eb1e43
	tzapu/WiFiManager@^2.0.17
	ArduinoJson@^7.2.1
	adafruit/Adafruit ADS1X15@^2.5.0
	adafruit/Adafruit BusIO@^1.17.3

lib_ignore = SerialFlash
lib_extra_dirs = lib

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_flags = -DSERIAL_RX_BUFFER_SIZE=256
build_src_filter = +<mega_stub.cpp>